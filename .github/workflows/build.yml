name: Build

env:
  RELEASE_NAME: 1.2.1-fix

permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: choco install innosetup netfx-4.8.1-devpack --no-progress -y

      - name: Build, test, and package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -ReleaseName $env:RELEASE_NAME

      - name: Upload x86 installer
        uses: actions/upload-artifact@v4
        with:
          name: OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-x86
          path: src/OneNoteMarkdown.Installer/Output/OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-x86.exe

      - name: Upload x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-x64
          path: src/OneNoteMarkdown.Installer/Output/OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-x64.exe

      - name: Upload Arm64 installer
        uses: actions/upload-artifact@v4
        with:
          name: OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-arm64
          path: src/OneNoteMarkdown.Installer/Output/OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-arm64.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/OneNoteMarkdown.Installer/Output/OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-x86.exe
            src/OneNoteMarkdown.Installer/Output/OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-x64.exe
            src/OneNoteMarkdown.Installer/Output/OneNoteMarkdownSetup-${{ env.RELEASE_NAME }}-arm64.exe
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
